[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-export"
version = "0.1.0"
description = "Export next week's US earnings calendar."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.62",
    "requests>=2.31",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
earnings-export = "earnings_export.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises a public external service using a real browser",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
